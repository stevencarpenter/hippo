name: hippo-otel

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1@sha256:a516c26968aa1feb5e5fc0562e3338ea13755cb4f373603226bcc4e276374ad0
    command: ["--config", "/etc/otelcol/config.yml"]
    volumes:
      - ./otelcol-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/config.yml:ro
      - ${HOME}/.local/share/hippo/otel/tempo:/var/tempo

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - ${HOME}/.local/share/hippo/otel/loki:/loki

  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${HIPPO_OTEL_PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${HIPPO_OTEL_PROMETHEUS_RETENTION_SIZE:-10GB}"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${HOME}/.local/share/hippo/otel/prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.4.4@sha256:378f94b054e5384cd74322cbf7542cff6a43e068e4011f81ea5e75323247df02
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${HIPPO_OTEL_GRAFANA_ADMIN_PASSWORD:-hippo}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=${HIPPO_OTEL_GRAFANA_ORG_NAME:-Main Org.}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - ${HOME}/.local/share/hippo/otel/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
