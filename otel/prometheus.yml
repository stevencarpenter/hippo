global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Knowledge-health exporter (scripts/hippo-metrics-exporter.py, runs on the
  # host under launchd): recall probe, graveyard, contamination, identity,
  # decisions, hygiene. host.docker.internal resolves to the host on Docker
  # Desktop; on Linux add extra_hosts: ["host.docker.internal:host-gateway"].
  - job_name: "hippo-knowledge-health"
    static_configs:
      - targets: ["host.docker.internal:9835"]
