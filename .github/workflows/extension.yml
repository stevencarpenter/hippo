name: Extension CI

on:
  pull_request:
    paths:
      - "extension/firefox/**"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "extension/firefox/**"
      - ".github/workflows/extension.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS on merges to main only, not every PR (macOS bills ~10x Linux).
        # Coverage preserved at merge; revert to `[ubuntu-latest, macos-latest]`
        # to require macOS pre-merge.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: extension/firefox
        run: npm ci

      - name: Typecheck and build
        working-directory: extension/firefox
        run: npm run build
