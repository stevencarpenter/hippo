name: Rust CI

on:
  workflow_call:
  pull_request:
    paths:
      - "crates/**"
      - "shell/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "shell/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.98" # Matches rust-toolchain.toml.
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Tag pushes and manual candidates test both platforms. PRs use Linux
        # to limit macOS runner costs. Reusable calls retain the caller's event.
        os: ${{ github.event_name != 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.98" # Matches rust-toolchain.toml.
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ matrix.os }}-${{ github.base_ref || github.ref_name }}
          cache-on-failure: true

      # PRs build and test with default features off: the otel stack (tonic,
      # prost, opentelemetry) is unused in CI and PR runs fire on every
      # agent-loop push. Merges to main build and test with otel on, and both
      # clippy steps type-check both configurations on every run, so a PR that
      # breaks otel-gated code still fails pre-merge.
      - name: Build all targets (PR, no default features)
        if: github.event_name == 'pull_request'
        run: cargo build --all-targets --locked --no-default-features

      - name: Build all targets (non-PR, default features)
        if: github.event_name != 'pull_request'
        run: cargo build --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked --no-deps -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -p hippo-daemon -- -D warnings

      - name: Run tests (PR, no default features)
        if: github.event_name == 'pull_request'
        run: cargo test --locked --no-fail-fast --no-default-features

      - name: Run tests (non-PR, default features)
        if: github.event_name != 'pull_request'
        run: cargo test --locked --no-fail-fast

      - name: Run tests (release feature set)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo test --locked --no-fail-fast --no-default-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@2f205a16b33670c6744bb9451ca070d71ad155fa # cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock
