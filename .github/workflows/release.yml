name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Candidate version matching package manifests and lockfiles (vX.Y.Z)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Match tag to manifests and lockfiles
        run: python scripts/check_release_version.py "$RELEASE_TAG"

  rust:
    needs: validate-version
    uses: ./.github/workflows/rust.yml

  python:
    needs: validate-version
    uses: ./.github/workflows/python.yml

  installer:
    needs: validate-version
    uses: ./.github/workflows/installer.yml

  build-daemon:
    name: Build Daemon Binary
    needs: validate-version
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.98" # Matches rust-toolchain.toml.
          targets: aarch64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-daemon-${{ github.ref_name }}
          cache-on-failure: false

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION}"

      # Minimal artifact: default features (otel) are disabled to keep the
      # binary and the build small. Build from source for the full feature
      # set. Symbol stripping comes from profile.release in Cargo.toml.
      - name: Build daemon binary (aarch64)
        run: |
          cargo build --release --target aarch64-apple-darwin --bin hippo --locked --no-default-features

      - name: Prepare artifact
        id: artifact
        run: |
          # Derive artifact name from build target, not runner arch, to avoid mismatches when runner arch differs from built arch
          ARTIFACT_NAME="hippo-darwin-arm64"
          cp target/aarch64-apple-darwin/release/hippo "${ARTIFACT_NAME}"
          chmod +x "${ARTIFACT_NAME}"
          echo "name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Artifact: ${ARTIFACT_NAME}"

      - name: Generate checksum
        id: checksum
        run: |
          ARTIFACT_NAME="${{ steps.artifact.outputs.name }}"
          CHECKSUM="$(shasum -a 256 "${ARTIFACT_NAME}" | awk '{print $1}')"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"
          echo "Checksum: ${CHECKSUM}"

      - name: Upload daemon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daemon-binary
          path: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  build-brain:
    name: Build Brain Package
    needs: validate-version
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION}"

      - name: Build brain package
        run: |
          cd brain
          uv build --build-constraints build-constraints.txt --require-hashes

      - name: Create brain tarball
        id: artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_NAME="hippo-brain-${VERSION}.tar.gz"

          # Create a temporary directory with all necessary files
          mkdir -p hippo-brain-release/brain

          # Copy the built wheel and source distribution
          cp -r brain/dist hippo-brain-release/brain/

          # Copy source files needed for installation
          cp -r brain/src hippo-brain-release/brain/
          cp brain/pyproject.toml hippo-brain-release/brain/
          cp brain/uv.lock hippo-brain-release/brain/
          cp brain/build-constraints.txt hippo-brain-release/brain/
          cp brain/README.md hippo-brain-release/brain/ 2>/dev/null || true

          # Copy runtime scripts AND shell hooks into the brain tree so
          # they install under ${BRAIN_DIR}/{scripts,shell} rather than
          # polluting ~/.local/share/ with generic top-level directories.
          # Matches install.rs::detect_vars which computes
          # scripts_dir = brain_dir.join("scripts").
          cp -r scripts hippo-brain-release/brain/
          cp -r shell hippo-brain-release/brain/

          # Ship the Claude Code skills so release installs get them too.
          # Without this they exist only in a source checkout, which is how
          # they went three months unshipped after PR #169.
          cp -r extension/claude-skill hippo-brain-release/brain/

          # Create the tarball (single top-level entry: brain/)
          tar -czf "${ARTIFACT_NAME}" -C hippo-brain-release brain

          echo "name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Artifact: ${ARTIFACT_NAME}"

      - name: Generate checksum
        id: checksum
        run: |
          ARTIFACT_NAME="${{ steps.artifact.outputs.name }}"
          CHECKSUM="$(shasum -a 256 "${ARTIFACT_NAME}" | awk '{print $1}')"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"
          echo "Checksum: ${CHECKSUM}"

      - name: Upload brain artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: brain-package
          path: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Prepare Release Bundle
    needs: [validate-version, rust, python, installer, build-daemon, build-brain]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"

      # Python.org's macOS build cannot load sqlite-vec extensions.
      - name: Install Python with SQLite extension support
        run: uv python install 3.14

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Prepare release files
        id: prepare
        run: |
          mkdir -p release-files

          # Move artifacts to release directory
          mv artifacts/daemon-binary/${{ needs.build-daemon.outputs.artifact_name }} release-files/
          mv artifacts/brain-package/${{ needs.build-brain.outputs.artifact_name }} release-files/

          # Copy install script
          cp scripts/install.sh release-files/install.sh

          echo "Release files prepared:"
          ls -lh release-files/

      - name: Generate checksums file
        run: |
          cd release-files
          {
            echo "${{ needs.build-daemon.outputs.checksum }}  ${{ needs.build-daemon.outputs.artifact_name }}"
            echo "${{ needs.build-brain.outputs.checksum }}  ${{ needs.build-brain.outputs.artifact_name }}"
          } > SHA256SUMS.txt

          # Verify checksums
          shasum -a 256 -c SHA256SUMS.txt

          echo "Generated checksums file:"
          cat SHA256SUMS.txt

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          cat > release-notes.md <<EOF
          # Hippo ${VERSION}

          ## Installation

          ### Quick Install (macOS)

          \`\`\`bash
          curl -fsSL https://github.com/stevencarpenter/hippo/releases/download/${RELEASE_TAG}/install.sh | bash
          \`\`\`

          ### Manual Installation

          1. Download the appropriate artifacts for your system
          2. Verify checksums against \`SHA256SUMS.txt\`
          3. Follow the installation instructions in the [README](https://github.com/stevencarpenter/hippo#manual-installation)

          ## Artifacts

          | Component | File | SHA-256 |
          |-----------|------|---------|
          | Daemon (CLI) | \`${{ needs.build-daemon.outputs.artifact_name }}\` | \`${{ needs.build-daemon.outputs.checksum }}\` |
          | Brain (Python) | \`${{ needs.build-brain.outputs.artifact_name }}\` | \`${{ needs.build-brain.outputs.checksum }}\` |

          ## Components

          - **hippo-daemon**: Rust binary for shell capture, secret redaction, and CLI queries. Minimal build with default features disabled (no OTel metrics exporter); build from source with \`cargo build --release\` for the full feature set.
          - **hippo-brain**: Python enrichment server with LLM integration and vector embeddings

          ## Verification

          \`\`\`bash
          # Verify checksums
          shasum -a 256 -c SHA256SUMS.txt
          \`\`\`
          EOF

          echo "Release notes prepared"

      - name: Archive release bundle
        run: tar -czf release-bundle.tar.gz release-files release-notes.md

      - name: Smoke test the packaged installation
        run: uv run --no-project --python 3.14 python scripts/smoke_release_bundle.py release-bundle.tar.gz --output-dir "$RUNNER_TEMP/hippo-release-smoke"

      - name: Upload installation smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-smoke-${{ env.RELEASE_TAG }}
          path: |
            ${{ runner.temp }}/hippo-release-smoke/results.json
            ${{ runner.temp }}/hippo-release-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle-${{ env.RELEASE_TAG }}
          path: release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: prepare-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle-${{ env.RELEASE_TAG }}

      - name: Extract release bundle
        run: tar -xzf release-bundle.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            # Release exists; update its notes and re-upload artifacts with --clobber
            gh release edit "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --notes-file release-notes.md

            gh release upload "${{ github.ref_name }}" \
              release-files/* \
              --clobber
          else
            # Release doesn't exist; create it
            gh release create "${{ github.ref_name }}" \
              --title "Release ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              release-files/*
          fi

      - name: Release summary
        run: |
          {
            echo "### Release ${RELEASE_TAG} published"
            echo '```bash'
            echo "curl -fsSL https://github.com/stevencarpenter/hippo/releases/download/${RELEASE_TAG}/install.sh | bash"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
