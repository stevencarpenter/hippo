[project]
name = "hippo-brain"
version = "0.40.1"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28",
  "mcp>=2.3.0,<3",
  "sqlite-vec>=0.1.6",
  "uvicorn>=0.42",
  "starlette>=1.3.1",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.33",
  "opentelemetry-exporter-otlp-proto-http>=1.33",
  "opentelemetry-instrumentation-logging>=0.54b1",
  "psutil>=6",
  "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
  "duckdb>=2.0,<3",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.17,<0.18",
  "sqlfluff>=4.1.0",
]

[project.scripts]
hippo-brain = "hippo_brain:main"
hippo-mcp = "hippo_brain:mcp_main"
hippo-eval = "hippo_brain.evaluation:main"
hippo-trust-eval = "hippo_brain.trust_eval:main"
hippo-evidence-inspect = "hippo_brain.evidence_packets:main"
hippo-agent-query = "hippo_brain.agent_query:main"
hippo-bench = "hippo_brain.bench.cli:main"
hippo-decision-bench = "hippo_brain.bench.decision_sidecar:main"
hippo-brain-api = "hippo_brain.api_cli:main"
hippo-brain-openapi = "hippo_brain.openapi:main"
hippo-auto-memory = "hippo_brain.auto_memory:main"
hippo-auto-memory-poll = "hippo_brain.auto_memory:poll_main"
hippo-auto-memory-reconcile = "hippo_brain.auto_memory:reconcile_file_main"
hippo-auto-memory-inventory = "hippo_brain.auto_memory:inventory_main"
hippo-auto-memory-replay = "hippo_brain.auto_memory:replay_main"
hippo-auto-memory-probe = "hippo_brain.auto_memory_probe:main"
hippo-memory-query = "hippo_brain.memory_query:main"

[build-system]
# Keep the backend aligned with the hashed release build environment.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
# Hashes also protect source installations using uv sync. Keep these entries
# aligned with build-constraints.txt, the strict release-build and audit input.
required-version = ">=0.12.17"
build-constraint-dependencies = [
  { requirement = "hatchling==1.32.4", hashes = [
    "sha256:08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c",
    "sha256:c4468f73144c054d2aab4ef0f0378c43b9878bf07f8ffd6b79690e970d375f07",
  ] },
  { requirement = "packaging==26.3", hashes = [
    "sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79",
    "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
  ] },
  { requirement = "pathspec==1.1.1", hashes = [
    "sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a",
    "sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
  ] },
  { requirement = "pluggy==1.7.0", hashes = [
    "sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec",
    "sha256:d1eaa46ebb595891b860ab086b4d09c8588af65ebd4361b8e8f4bb8920b90ba8",
  ] },
  { requirement = "tomlkit==0.15.2", hashes = [
    "sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437",
    "sha256:83e32755ba1d20d9340bd069ee97e9f6232ba2346b63ffcba425de01f7e327a6",
  ] },
  { requirement = "trove-classifiers==2026.9.21.13", hashes = [
    "sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71",
    "sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17",
  ] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/hippo_brain"]

# The repository's JSONL ignore rules also apply to this nested project.
[tool.hatch.build.targets.wheel.force-include]
"src/hippo_brain/bench/qa_template.jsonl" = "hippo_brain/bench/qa_template.jsonl"
# Preserve the CLI's current questions, independently of the historical fixture.
"tests/eval_questions.json" = "hippo_brain/_fixtures/default_eval_questions.json"

[tool.hatch.build.targets.sdist.force-include]
"src/hippo_brain/bench/qa_template.jsonl" = "src/hippo_brain/bench/qa_template.jsonl"
"tests/fixtures/golden_corpus_v1/qa.jsonl" = "tests/fixtures/golden_corpus_v1/qa.jsonl"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set; keep the rules this codebase was written against.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts do sys.path.insert before imports by design.
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: tests requiring a running LM Studio instance"]

[tool.coverage.run]
source_pkgs = ["hippo_brain"]
omit = ["*/scripts/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 82
exclude_also = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
