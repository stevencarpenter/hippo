# Security overrides — force patched versions of (mostly transitive) deps
# flagged by Dependabot / `pnpm audit`. pnpm 10 reads `overrides` from here,
# not from the deprecated "pnpm" field in package.json.
#
#   astro is bumped directly in package.json (^7.4.2); the rest are transitive:
#   - devalue / dompurify / vite / esbuild / yaml / js-yaml : astro + vitest
#   - undici                                      : unifont, jsdom, linkinator
#   - brace-expansion@5                           : dev-only, via linkinator
#   - fast-uri                                    : dev-only, via @astrojs/check -> ajv
#   - source-map-js                               : astro -> svgo, magicast
#   - smol-toml                                   : astro -> @astrojs/internal-helpers
#
#   Advisory floors: devalue >=5.9.3, dompurify >=3.4.17, js-yaml >=4.3.2,
#   fast-uri >=3.1.9, undici >=7.30.1, brace-expansion >=5.0.12,
#   vite >=8.2.4, source-map-js >=1.2.2, smol-toml >=1.9.0.
#   Loosening any of them below its floor reopens a Dependabot alert.
#
#   vite tracks whatever major astro requires — Astro 7 requires Vite 8
#   (astro's own package.json pins "vite": "^8.0.13"); bump this alongside
#   any future astro major upgrade or the override silently downgrades vite
#   and breaks the static build.
overrides:
  devalue: "^5.9.3"
  dompurify: "^3.4.17"
  vite: "^8.2.4"
  esbuild: "^0.28.1"
  yaml: "^2.8.3"
  js-yaml: "^4.3.2"
  fast-uri: "^3.1.9"
  undici: "^7.30.1"
  "brace-expansion@5": "^5.0.12"
  source-map-js: "^1.2.2"
  smol-toml: "^1.9.0"
  # Pin until an upstream fix passes tests/cache-security.test.ts.
  http-cache-semantics: "4.3.0"

patchedDependencies:
  # GHSA-ch52-4w7c-c8xp also reproduces in the published 4.3.0 source.
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
